<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluely Admin & Inventory Dashboard</title>
    
    <!-- Tailwind CSS Play CDN (Guarantees instant styling without build errors) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bluely: {
                            50: '#e6f0fa',
                            500: '#0284c7',
                            600: '#02689c',
                            700: '#034f75'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
